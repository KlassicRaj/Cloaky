<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="same-origin">
    <title>Sign in · Visitor Routing</title>
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/login.js" defer></script>
</head>
<body class="page page-centered">
    <main class="panel login-panel">
        <a class="brand" href="/login">Visitor Routing</a>
        <h1>Sign in</h1>
        <p class="muted">Sign in to manage your projects.</p>
        <form id="login-form" class="form-stack">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <p id="login-error" class="message error-message" role="alert" hidden></p>
            <button id="login-submit" type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
